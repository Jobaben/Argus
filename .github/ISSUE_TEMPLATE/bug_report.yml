name: Bug report
description: Something broke, rendered wrong, or didn't match what ~/.claude contains
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Security problems should **not** go here —
        see [SECURITY.md](../blob/main/SECURITY.md) for private reporting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did Argus show, and what did you expect?
      placeholder: |
        1. Created a schedule with an interval trigger…
        2. The Monitors tab showed…
        3. I expected…
    validations:
      required: true
  - type: textarea
    id: data-shape
    attributes:
      label: What does the underlying data look like?
      description: >
        If the dashboard disagrees with reality, the relevant file under
        ~/.claude (or ~/.claude/argus/) is the most useful thing you can
        paste — redact anything private.
      render: json
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Argus version
      description: "`argus --version`, or the version field of GET /api/health"
      placeholder: 0.4.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and Node version
      placeholder: macOS 15 / Node 22.12.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log output
      description: Anything relevant from the terminal running Argus.
      render: text
    validations:
      required: false
