<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f16" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Argus" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Argus — schedule and monitor your Claude Code agents" />
    <title>Argus</title>
    <!-- The first screen waits on the session status (App gates on it), and the
         app would only ask once its scripts had run. Asked for here, it is in
         flight beside them. -->
    <link rel="preload" href="/api/auth/status" as="fetch" crossorigin />
    <!-- Both faces every screen sets text in. Left to the stylesheet, the
         semibold one was asked for only once the first heading was laid out,
         and that text stayed invisible until it came. -->
    <link
      rel="preload"
      href="/fonts/Hellix-Regular-ma.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/Hellix-SemiBold-ma.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      :root {
        color-scheme: dark;
        background-color: #0a0f16;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
