<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* The tokens this view draws with, as web/src/index.css declares them. */
  :root {
    --ground:#0a0f16; --ground-2:#0d131c; --surface:#111a25;
    --line:rgb(146 180 217 / .13);
    --ink:#eaf2fb; --ink-dim:#aebfd2; --ink-faint:#8597ae;
    --eye:#36e3e8; --run:#ffb224; --ok:#2fe6a4; --fail:#ff5765; --queue:#4db5ff;
    --idle:#7c8aa0;
    --text-caption:12px; --text-micro:11px;
    --radius-panel:16px;
    --duration-pulse:1400ms;
    --shadow-raised:inset 0 1px 0 0 rgb(255 255 255 / .035), 0 1px 2px 0 rgb(0 0 0 / .35),
      0 12px 32px -18px rgb(0 0 0 / .6);
    --sans:"Hellix","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  @font-face { font-family:"Hellix"; src:url("../../fonts/Hellix-Regular-ma.woff2") format("woff2");
    font-weight:400; font-display:swap; }
  @font-face { font-family:"Hellix"; src:url("../../fonts/Hellix-SemiBold-ma.woff2") format("woff2");
    font-weight:600 900; font-display:swap; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-variant-numeric:tabular-nums; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:26px; }
  svg { display:block; fill:none; stroke:currentColor; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; }

  .panel { width:100%; max-width:860px; border:1px solid var(--line);
    border-radius:var(--radius-panel); background:var(--surface); box-shadow:var(--shadow-raised);
    padding:14px 16px 12px; }

  /* The key, above the chart: on a wide window most bars are too short to
     label, so the colours have to be stated. */
  .keys { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:8px 24px; margin:0 0 12px; }
  .key { display:flex; flex-wrap:wrap; align-items:center; gap:6px 16px; margin:0;
    font-size:var(--text-caption); line-height:1.4; color:var(--ink-faint); }
  .key div { display:flex; align-items:center; gap:6px; }
  /* The mark and its name are one term, as the Legend renders it. */
  .key dt { display:contents; }
  .swatch { display:block; width:16px; height:10px; border:1px solid; border-radius:4px; }
  .swatch.live { position:relative; width:20px; border-right:0; border-radius:4px 0 0 4px; }
  .swatch.live::after { content:""; position:absolute; right:2px; top:50%; width:6px; height:6px;
    margin-top:-3px; border-radius:999px; background:currentColor;
    box-shadow:0 0 6px 1px currentColor; }

  .axis, .lane, .grid { display:flex; }
  .gutter { width:240px; flex:none; }
  .track { position:relative; flex:1; min-width:0; }
  .axis { border-top:1px solid color-mix(in oklab, var(--line) 60%, transparent); padding-top:4px; }
  .axis .track { height:24px; }
  /* Times are read, not copied, so they are set in the brand face — at the
     type floor, never under it. The first tick sits on the track's left edge,
     so it is not centred on it. */
  .tick { position:absolute; top:4px; transform:translateX(-50%);
    font-size:var(--text-micro); line-height:1.3; color:var(--ink-faint); }
  .tick:first-child { transform:none; }
  .now { position:absolute; right:0; top:4px; font-size:var(--text-micro); line-height:1.3;
    font-weight:600; color:var(--eye); }
  .body { position:relative; }
  .grid { position:absolute; inset:0; pointer-events:none; }
  .gl { position:absolute; top:0; bottom:0; width:1px;
    background:color-mix(in oklab, var(--line) 60%, transparent); }
  .nowline { position:absolute; top:0; bottom:0; right:0; width:1px;
    background:color-mix(in oklab, var(--eye) 50%, transparent); }

  .lane { border-top:1px solid color-mix(in oklab, var(--line) 60%, transparent); }
  .lane .gutter { display:flex; align-items:center; gap:8px; height:36px; padding-right:12px;
    min-width:0; }
  /* What a lane is — a schedule, an agent, a session — is a category, so its
     chip is neutral. Colour on this chart means status, and it is on the bars. */
  .kind { display:inline-flex; flex:none; align-items:center; justify-content:center;
    width:20px; height:20px; border:1px solid var(--line); border-radius:6px;
    background:color-mix(in oklab, var(--ground-2) 60%, transparent); color:var(--ink-faint); }
  .gname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:var(--text-caption); line-height:1.4; font-weight:600; color:var(--ink-dim); }
  .count { flex:none; font-size:var(--text-micro); line-height:1.3; color:var(--ink-faint); }
  .rows { flex:1; min-width:0; padding:4px 0; }
  .r { position:relative; height:28px; }

  /* A bar is its own size container: its label shows once the bar can carry a
     word, whatever share of whatever track that is. */
  .bar { position:absolute; top:2px; bottom:2px; display:flex; align-items:center;
    overflow:hidden; border:1px solid; border-radius:6px; container-type:inline-size; }
  .bar span { display:none; padding:0 6px; font-size:var(--text-micro); line-height:1.3;
    font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  @container (min-width: 3rem) { .bar span { display:block; } }
  .bar.open { border-right:0; border-radius:6px 0 0 6px; }
  .bar.open span { padding-right:16px; }

  .done    { background:color-mix(in oklab, var(--ok) 20%, transparent);
             border-color:color-mix(in oklab, var(--ok) 50%, transparent); color:var(--ok); }
  .working { background:color-mix(in oklab, var(--run) 25%, transparent);
             border-color:color-mix(in oklab, var(--run) 60%, transparent); color:var(--run); }
  .failed  { background:color-mix(in oklab, var(--fail) 25%, transparent);
             border-color:color-mix(in oklab, var(--fail) 60%, transparent); color:var(--fail); }
  .queued  { background:color-mix(in oklab, var(--queue) 20%, transparent);
             border-color:color-mix(in oklab, var(--queue) 50%, transparent); color:var(--queue); }
  .idle    { background:color-mix(in oklab, var(--idle) 15%, transparent);
             border-color:color-mix(in oklab, var(--idle) 40%, transparent); color:var(--idle); }

  /* Every live bar breathes on the same beat, in its own colour. */
  .pulse { position:absolute; right:4px; top:50%; width:6px; height:6px; margin-top:-3px;
    border-radius:999px; background:currentColor; box-shadow:0 0 8px 1px currentColor;
    animation:pulse var(--duration-pulse) ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @media (prefers-reduced-motion:reduce){ .pulse{animation:none} }
</style>
</head>
<body>
  <!-- Chronicle timeline: every schedule run, agent and session as a span on
       one time axis. Overlaps pack into extra rows by where the bars are drawn,
       so two runs seconds apart never sit one over the other; in-flight spans
       run open-ended into the eye-coloured "Now" line with a pulse.

       Colour is status and only status: the bars wear it (succeeded, failed,
       still running, queued, idle), and the key above the chart states it.
       What a lane is — schedule, agent, session — is a category, drawn as a
       neutral icon chip; those used to be blue, cyan and violet capitals, which
       read as statuses and made a session lane look like it was waiting on you.
       Labels are sentence case in the brand face; nothing is under 11px. -->
  <div class="panel">
    <div class="keys">
      <dl class="key" aria-label="Run status">
        <div><dt><span class="swatch done" aria-hidden="true"></span>Succeeded</dt></div>
        <div><dt><span class="swatch failed" aria-hidden="true"></span>Failed</dt></div>
        <div><dt><span class="swatch working live" aria-hidden="true"></span>Still running</dt></div>
        <div><dt><span class="swatch queued" aria-hidden="true"></span>Queued</dt></div>
        <div><dt><span class="swatch idle" aria-hidden="true"></span>Idle</dt></div>
      </dl>
      <dl class="key" aria-label="Lane kind">
        <div>
          <dt><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.5h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z M4.5 10h15 M8.5 3.5v4M15.5 3.5v4"/></svg>Schedule</dt>
        </div>
        <div>
          <dt><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9L12 3.5Z M18.5 16v4M16.5 18h4"/></svg>Agent</dt>
        </div>
        <div>
          <dt><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.5h13a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z M8 9.5l3 2.5-3 2.5 M13 15h3.5"/></svg>Session</dt>
        </div>
      </dl>
    </div>

    <div class="axis" aria-hidden="true">
      <div class="gutter"></div>
      <div class="track">
        <span class="tick" style="left:0%">14:00</span><span class="tick" style="left:25%">15:30</span>
        <span class="tick" style="left:50%">17:00</span><span class="tick" style="left:75%">18:30</span>
        <span class="now">Now</span>
      </div>
    </div>
    <div class="body">
      <div class="grid" aria-hidden="true">
        <div class="gutter"></div>
        <div class="track">
          <span class="gl" style="left:25%"></span><span class="gl" style="left:50%"></span>
          <span class="gl" style="left:75%"></span><span class="nowline"></span>
        </div>
      </div>
      <div class="lane">
        <div class="gutter">
          <span class="kind" title="Agent">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-label="Agent" role="img"><path d="M12 3.5l1.9 5.1 5.1 1.9-5.1 1.9L12 17.5l-1.9-5.1L5 10.5l5.1-1.9L12 3.5Z M18.5 16v4M16.5 18h4"/></svg>
          </span>
          <span class="gname">Background agents</span>
          <span class="count" title="Runs in this lane">3</span>
        </div>
        <div class="rows">
          <div class="r">
            <div class="bar done" style="left:6%;width:22%"><span>Fix CI</span></div>
            <div class="bar working open" style="left:62%;width:38%"><span>Refactor auth</span><i class="pulse"></i></div>
          </div>
          <div class="r"><div class="bar done" style="left:14%;width:18%"><span>Bump deps</span></div></div>
        </div>
      </div>
      <div class="lane">
        <div class="gutter">
          <span class="kind" title="Schedule">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-label="Schedule" role="img"><path d="M5.5 5.5h13a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-12a1 1 0 0 1 1-1Z M4.5 10h15 M8.5 3.5v4M15.5 3.5v4"/></svg>
          </span>
          <span class="gname">Nightly triage</span>
          <span class="count" title="Runs in this lane">3</span>
        </div>
        <div class="rows">
          <div class="r">
            <div class="bar done" style="left:2%;width:9%"><span>Nightly triage</span></div>
            <div class="bar idle" style="left:27%;width:1.5%"><span>Nightly triage</span></div>
            <div class="bar failed" style="left:44%;width:9%"><span>Nightly triage</span></div>
          </div>
        </div>
      </div>
      <div class="lane">
        <div class="gutter">
          <span class="kind" title="Session">
            <svg width="12" height="12" viewBox="0 0 24 24" aria-label="Session" role="img"><path d="M5.5 4.5h13a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1v-13a1 1 0 0 1 1-1Z M8 9.5l3 2.5-3 2.5 M13 15h3.5"/></svg>
          </span>
          <span class="gname" title="home/user/webapp">…/user/webapp</span>
          <span class="count" title="Runs in this lane">1</span>
        </div>
        <div class="rows">
          <div class="r"><div class="bar working open" style="left:78%;width:22%"><span>Add dark mode toggle</span><i class="pulse"></i></div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
