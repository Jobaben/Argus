<!-- @dsCard group="Components" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  /* The tokens this primitive draws with, as web/src/index.css declares them. */
  :root {
    --ground:#0a0f16; --surface-2:#162130; --surface-3:#1c2a3b;
    --line:rgb(146 180 217 / .13); --line-strong:rgb(146 180 217 / .24);
    --ink:#eaf2fb; --ink-dim:#aebfd2; --ink-faint:#8597ae; --eye:#36e3e8;
    --fail:#ff5765; --fail-ink:#ffc4ca;
    --radius-control:8px; --radius-tile:12px;
    --duration-quick:120ms; --duration-press:70ms; --duration-alert:2200ms;
    --sans:"Hellix","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  @font-face { font-family:"Hellix"; src:url("../../fonts/Hellix-Regular-ma.woff2") format("woff2");
    font-weight:400; font-display:swap; }
  @font-face { font-family:"Hellix"; src:url("../../fonts/Hellix-SemiBold-ma.woff2") format("woff2");
    font-weight:600 900; font-display:swap; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--sans);
    font-variant-numeric:tabular-nums; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:26px; }
  svg { display:block; fill:none; stroke:currentColor; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; flex:none; }
  .wrap { width:100%; max-width:820px; display:grid; gap:18px; }
  .eyebrow { margin:0 0 8px; font-size:11px; line-height:1.3; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; font-feature-settings:"case"; color:var(--ink-faint); }

  .strip { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; width:100%;
    padding:12px 16px; border:1px solid color-mix(in oklab, var(--fail) 35%, transparent);
    border-radius:var(--radius-tile);
    background:linear-gradient(to right, color-mix(in oklab, var(--fail) 14%, transparent),
      color-mix(in oklab, var(--fail) 4%, transparent)); }
  /* `failed`: a run failed — news, so its badge pulses on the shared alert beat. */
  .badge { border:1px solid color-mix(in oklab, var(--fail) 50%, transparent); border-radius:999px;
    background:color-mix(in oklab, var(--fail) 20%, transparent); padding:4px 10px;
    font-size:12px; line-height:1; font-weight:600; color:var(--fail);
    animation:pulse var(--duration-alert) ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }
  @media (prefers-reduced-motion: reduce) { .badge { animation:none; } }
  .icon { color:var(--fail); }
  .msg { flex:1 1 12rem; min-width:0; font-size:13px; line-height:1.45; }
  .msg b { font-weight:600; color:var(--ink); }
  .msg span { color:var(--fail-ink); overflow-wrap:break-word; }
  .when { white-space:nowrap; font-size:12px; line-height:1.4; color:var(--ink-dim); }

  .btn { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px;
    border:1px solid var(--line-strong); border-radius:var(--radius-control); background:var(--surface-2);
    color:var(--ink); font-family:var(--sans); font-size:12px; font-weight:600; white-space:nowrap;
    cursor:pointer; transition:background-color var(--duration-quick); }
  .btn:hover { background:var(--surface-3); }
  .btn:focus-visible { outline:2px solid var(--eye); outline-offset:2px; }
  @media (prefers-reduced-motion: no-preference) {
    .btn:active { transform:scale(.97); transition-duration:var(--duration-press); }
  }
</style>
</head>
<body>
  <!-- AlertStrip (web/src/ds/AlertStrip.tsx): something went wrong, and with
       what. Two messages that used to look identical:

       - tone="failed": a run failed. An event about your agents — news — so it
         carries a "Failed" badge that pulses on the shared alert beat
         (2200ms, in phase with every other ambient indicator).
       - tone="error" (default): Argus itself could not do something — a load,
         a save. A condition to fix, not news: a still alert icon, no pulse.
         Load errors are worded by loadError(): "Couldn't load the Chronicle:
         database is locked", or just "Couldn't reach the Argus server".

       Subject in ink SemiBold, the message in fail-ink, an optional time in ink
       dim, and one recovery action at the far end ("Retry", "Jump to
       failure"), a small secondary button. The message keeps a 12rem floor and
       the rest wraps to a line of its own on a phone. role="status" for a
       condition found on load; role="alert" for the result of something the
       reader just did. Never nested inside another live region. -->
  <div class="wrap">
    <section>
      <p class="eyebrow">Failed</p>
      <div class="strip" role="status">
        <span class="badge">Failed</span>
        <span class="msg"><b>Run tests</b> <span>exit code 1: 3 of 214 tests failed</span></span>
        <span class="when">at 00:41</span>
        <button class="btn" type="button">Jump to failure</button>
      </div>
    </section>
    <section>
      <p class="eyebrow">Error</p>
      <div class="strip" role="status">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 4.5a2 2 0 0 1 3.4 0l7 12.1a2 2 0 0 1-1.7 3H5a2 2 0 0 1-1.7-3l7-12.1Z M12 9.5v4 M12 16.6v.4"/></svg>
        <span class="msg"><b>Chronicle</b> <span>Couldn't load the Chronicle: database is locked</span></span>
        <button class="btn" type="button"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12a7.5 7.5 0 1 0 2.4-5.5L4.5 8.8 M4.5 4.5v4.3h4.3"/></svg>Retry</button>
      </div>
    </section>
  </div>
</body>
</html>
